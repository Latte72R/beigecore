name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    make:
        name: make targets
        runs-on: ubuntu-24.04

        env:
            VERYL_VERSION: "0.20.2"

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential \
                    curl \
                    unzip \
                    python3 \
                    gcc-riscv64-unknown-elf \
                    binutils-riscv64-unknown-elf \
                    verilator \
                    yosys

            - name: Install Veryl
              run: |
                  curl -fsSL \
                    "https://github.com/veryl-lang/veryl/releases/download/v${VERYL_VERSION}/veryl-x86_64-linux.zip" \
                    -o veryl.zip
                  unzip -q veryl.zip -d veryl-dist
                  mkdir -p "${HOME}/.local/bin"
                  install -m 0755 "$(find veryl-dist -type f -name veryl -print -quit)" "${HOME}/.local/bin/veryl"
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
                  export PATH="${HOME}/.local/bin:${PATH}"
                  veryl --version

            - name: make build
              run: make build

            - name: make sim
              run: make sim

            - name: make test
              run: make test

            - name: make bench
              run: make bench COREMARK_ITERATIONS=1 COREMARK_CYCLES=20000000

            - name: make synth
              run: make synth

            - name: make fmax
              run: make fmax
