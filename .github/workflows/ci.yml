name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    make:
        name: make targets
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential \
                    python3 \
                    python3-pyelftools \
                    gcc-riscv64-unknown-elf \
                    binutils-riscv64-unknown-elf \
                    verilator \
                    yosys

            - name: Install Veryl nightly
              uses: veryl-lang/setup-veryl@v1
              with:
                  version: nightly

            - name: Show Veryl version
              run: veryl --version

            - name: make build
              run: make build

            - name: make sim
              run: make sim

            - name: make test
              run: make test

            - name: make bench
              run: make bench COREMARK_ITERATIONS=1 COREMARK_CYCLES=20000000

            - name: Upload Konata trace
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: konata-trace
                  path: results/konata.log
                  if-no-files-found: warn

            - name: make synth
              run: make synth
